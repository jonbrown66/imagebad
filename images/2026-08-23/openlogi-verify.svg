<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#fbfcfd"/><text x="80" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17191c">15 分钟验证链</text><text x="80" y="120" font-family="Arial,sans-serif" font-size="17" fill="#666b73">先测高频动作，再决定是否迁移整套鼠标配置</text><g font-family="Arial,sans-serif"><g><rect x="80" y="220" width="210" height="145" rx="18" fill="#fff" stroke="#d8dde4"/><text x="105" y="262" font-size="15" fill="#6c727a">STEP 1</text><text x="105" y="302" font-size="21" font-weight="700" fill="#24272b">安装并接设备</text><text x="105" y="335" font-size="15" fill="#6c727a">先退出 Options+</text></g><g><rect x="350" y="220" width="210" height="145" rx="18" fill="#fff" stroke="#d8dde4"/><text x="375" y="262" font-size="15" fill="#6c727a">STEP 2</text><text x="375" y="302" font-size="21" font-weight="700" fill="#24272b">测 3 个动作</text><text x="375" y="335" font-size="15" fill="#6c727a">侧键 · DPI · 应用配置</text></g><g><rect x="620" y="220" width="210" height="145" rx="18" fill="#fff9dc" stroke="#e2d58d"/><text x="645" y="262" font-size="15" fill="#6c727a">STEP 3</text><text x="645" y="302" font-size="21" font-weight="700" fill="#24272b">复制 TOML</text><text x="645" y="335" font-size="15" fill="#6c727a">迁到第二台电脑</text></g><g><rect x="890" y="220" width="230" height="145" rx="18" fill="#fff" stroke="#d8dde4"/><text x="915" y="262" font-size="15" fill="#6c727a">STEP 4</text><text x="915" y="302" font-size="21" font-weight="700" fill="#24272b">用一天再判断</text><text x="915" y="335" font-size="15" fill="#6c727a">误触 · 切换 · 滚轮</text></g><path d="M290 292 H350 M560 292 H620 M830 292 H890" stroke="#7d8790" stroke-width="2"/></g><text x="80" y="485" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24272b">验收：</text><text x="145" y="485" font-family="Arial,sans-serif" font-size="17" fill="#5f656d">无漏触发 · 应用配置自动切换 · TOML 可复现主要设置 · SmartShift 符合原习惯</text></svg>